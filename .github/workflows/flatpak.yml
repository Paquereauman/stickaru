name: Flatpak
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.Paquereauman.Stickaru.yml
          flatpak build-bundle repo Stickaru.flatpak io.github.Paquereauman.Stickaru
      - name: Smoke test
        run: |
          sudo apt-get install -y xvfb
          flatpak --user install -y --noninteractive --bundle Stickaru.flatpak
          xvfb-run -a flatpak run --command=python3 io.github.Paquereauman.Stickaru -c "
          import os,sys
          sys.path.insert(0,'/app/share/stickaru')
          os.environ['SDL_AUDIODRIVER']='dummy'
          import pygame; pygame.init()
          import bibliotheque
          b=bibliotheque.Bibliotheque()
          print('OK', pygame.display.get_caption())
          bibliotheque.copier_image_presse_papiers(open('/app/share/icons/hicolor/512x512/apps/io.github.Paquereauman.Stickaru.png','rb').read())
          print('CLIP OK')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: Stickaru.flatpak
          path: Stickaru.flatpak
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" Stickaru.flatpak --clobber
        env:
          GH_TOKEN: ${{ github.token }}
